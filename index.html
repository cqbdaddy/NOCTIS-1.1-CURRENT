<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<link rel="apple-touch-icon" href="noctis-logo-192.png">
<meta name="theme-color" content="#050607">
<meta name="description" content="NOCTIS — personal field operating environment">
<link rel="manifest" href="manifest.webmanifest">
<title>NOCTIS</title>
<style>
:root{--bg:#050607;--panel:#0d1012;--panel2:#14191c;--line:#252c30;--muted:#899398;--white:#f1f4f4;--accent:#cbd2d4;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--white);font-family:Inter,Roboto,"Helvetica Neue",Arial,sans-serif}body{overflow:hidden;letter-spacing:.01em}button,input,textarea,select{font:inherit}button{color:inherit;cursor:pointer}.shell{height:100vh;height:100dvh;min-height:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 5%,#151a1d 0%,#080a0b 42%,#050607 78%)}.status{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:#c7ced0;font-size:11px;letter-spacing:.12em;border-bottom:1px solid #ffffff0a}.status .right{display:flex;gap:11px;align-items:center}.signal{display:flex;gap:2px;align-items:end;height:11px}.signal i{display:block;width:3px;background:#cbd2d4;border-radius:2px}.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:6px}.signal i:nth-child(3){height:8px}.signal i:nth-child(4){height:10px}.battery{width:18px;height:9px;border:1px solid #cbd2d4;border-radius:2px;position:relative}.battery:after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:#cbd2d4}.battery:before{content:"";position:absolute;inset:2px;background:#cbd2d4;width:70%}.main{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:18px 20px calc(24px + var(--safe))}.main::-webkit-scrollbar{display:none}.topline{display:flex;justify-content:space-between;align-items:center;margin:5px 0 26px}.brand{display:flex;gap:10px;align-items:center}.crescent{width:30px;height:30px;display:block;object-fit:cover;border-radius:50%;background:#050607}.brandname{font-size:12px;letter-spacing:.34em;font-weight:600}.system-tag{font-size:9px;color:#778186;letter-spacing:.18em}.clock{font-size:clamp(48px,13vw,68px);font-weight:200;letter-spacing:-.065em;line-height:1;margin:0}.date{color:#8e999d;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-top:8px}.greeting{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.weather{font-size:10px;color:#879195;text-align:right;line-height:1.7;letter-spacing:.12em}.sectionlabel{font-size:9px;color:#788388;letter-spacing:.22em;text-transform:uppercase;margin:24px 0 11px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.app{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}.appicon{width:min(16vw,62px);height:min(16vw,62px);border:1px solid #343c40;background:linear-gradient(145deg,#171d20,#090b0c);border-radius:17px;display:grid;place-items:center;box-shadow:0 8px 24px #0008,inset 0 1px #ffffff0a}.appicon svg{width:23px;height:23px;stroke:#dce2e3;fill:none;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}.app span:last-child{font-size:10px;color:#b7c0c2;letter-spacing:.02em}.tile{border:1px solid var(--line);background:linear-gradient(135deg,#111619,#0a0c0d);border-radius:13px;padding:14px;min-height:88px}.tile .k{font-size:9px;color:#778388;letter-spacing:.16em;text-transform:uppercase}.tile .v{font-size:18px;font-weight:300;margin-top:10px}.tile .sub{font-size:10px;color:#849095;margin-top:5px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dock{flex:none;padding:10px 22px calc(12px + var(--safe));display:flex;justify-content:center;gap:18px;background:linear-gradient(180deg,#080a0b00,#080a0beF);border-top:1px solid #ffffff0a}.dock button{width:48px;height:48px;border:1px solid #30383c;background:#111619;border-radius:15px;display:grid;place-items:center}.dock svg{width:20px;height:20px;stroke:#dce2e3;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.dock button.active{background:#e5e9e9;color:#080a0b}.dock button.active svg{stroke:#080a0b}.screenhead{display:flex;align-items:center;gap:12px;margin:6px 0 24px}.back{width:36px;height:36px;border:1px solid var(--line);background:#101416;border-radius:11px;font-size:18px}.screenhead h1{font-size:22px;font-weight:300;letter-spacing:-.03em;margin:0}.screenhead small{display:block;color:#7d898e;font-size:9px;letter-spacing:.18em;margin-top:5px}.card{background:linear-gradient(145deg,#121719,#0a0c0d);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}.card h3{font-size:12px;font-weight:500;letter-spacing:.08em;margin:0 0 12px}.muted{color:var(--muted);font-size:11px;line-height:1.6}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:9px;color:#879398;letter-spacing:.15em;text-transform:uppercase}.field input,.field textarea,.field select{background:#080b0c;border:1px solid #2a3236;border-radius:9px;padding:11px;color:#edf1f1;outline:none;width:100%;font-size:13px}.field textarea{min-height:85px;resize:vertical}.action{border:1px solid #596267;background:#dce1e2;color:#090b0c;border-radius:9px;padding:11px 15px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}.secondary{background:#111618;color:#dce2e3;border-color:#30393d}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.listitem{padding:12px 0;border-bottom:1px solid #252d31;display:flex;justify-content:space-between;gap:10px;font-size:12px}.listitem:last-child{border:0}.pill{font-size:9px;color:#aeb8bb;border:1px solid #384247;border-radius:30px;padding:4px 8px;white-space:nowrap}.shade{position:fixed;inset:0;background:#030405f2;z-index:10;padding:48px 22px 30px;transform:translateY(-105%);transition:transform .28s ease;overflow:auto}.shade.open{transform:translateY(0)}.shadehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.shadehead strong{font-size:12px;letter-spacing:.25em}.close{border:1px solid #343d41;background:#101416;border-radius:9px;padding:8px 12px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{padding:18px 13px;text-align:left;background:#151b1e;border:1px solid #323b40;border-radius:12px;font-size:11px}.quick button span{display:block;color:#8c999e;font-size:9px;margin-top:7px}.shade .field input{max-width:100%}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#dfe4e5;color:#090b0c;padding:10px 15px;border-radius:8px;font-size:11px;z-index:20;display:none;white-space:nowrap}.empty{padding:20px;text-align:center;color:#829095;font-size:11px;line-height:1.7}.footerline{height:1px;background:linear-gradient(90deg,transparent,#323b3f,transparent);margin:20px 0}
button{ -webkit-tap-highlight-color:transparent; touch-action:manipulation }
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:1px solid #cbd2d4;outline-offset:2px}
input,textarea,select{font-size:16px!important} .appicon{box-shadow:0 5px 18px #0007,inset 0 1px #ffffff08} .dock{padding-bottom:calc(12px + var(--safe));backdrop-filter:blur(12px)} .shade{padding-top:calc(32px + env(safe-area-inset-top,0px));padding-bottom:calc(30px + var(--safe));overscroll-behavior:contain} .status{padding-top:env(safe-area-inset-top,0px);height:calc(34px + env(safe-area-inset-top,0px));min-height:34px} .main{padding-top:calc(18px + env(safe-area-inset-top,0px))} .screenhead{position:sticky;top:-1px;z-index:2;padding:5px 0 12px;background:linear-gradient(#080a0b 75%,#080a0b00)} .card,.tile,.appicon,.dock button{ -webkit-backface-visibility:hidden;backface-visibility:hidden }
@media(max-height:700px){.topline{margin-bottom:18px}.sectionlabel{margin-top:18px}.clock{font-size:50px}.appicon{width:52px;height:52px;border-radius:14px}.grid{row-gap:10px}}
@media(min-width:700px){.main{max-width:520px;width:100%;margin:0 auto}.status{padding:0 max(20px,calc((100vw - 520px)/2))}.grid{gap:18px}.appicon{width:62px;height:62px}.shell{border-left:1px solid #171d20;border-right:1px solid #171d20;max-width:520px;margin:auto}.dock{max-width:520px;width:100%;margin:auto}}
</style>
</head>
<body>
<div class="shell">
  <div class="status" id="status" onclick="openShade()"><span id="statusTime">17:33</span><span class="right"><span class="system-tag">NOCTIS CORE</span><span class="signal"><i></i><i></i><i></i><i></i></span><span>Wi-Fi</span><span class="battery"></span></span></div>
  <main class="main" id="main"></main>
  <nav class="dock" id="dock">
    <button class="active" aria-label="Home" onclick="home()"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></button>
    <button aria-label="Medical" onclick="openApp('medical')"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9"/></svg></button>
    <button aria-label="Library" onclick="openApp('library')"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 1 4 17.5zM4 6h16M8 9h8M8 13h8"/></svg></button>
    <button aria-label="Settings" onclick="openApp('settings')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.5.9l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.5-.9l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-1.8l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.5-.9l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.5.9l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 1.7z"/></svg></button>
  </nav>
</div>
<div class="shade" id="shade">
  <div class="shadehead"><strong>NOCTIS CONTROL CENTER</strong><button class="close" onclick="closeShade()">CLOSE</button></div>
  <div style="font-size:42px;font-weight:200" id="shadeClock">17:33</div><div class="muted" id="shadeDate"></div>
  <div class="sectionlabel">SYSTEM CONTROLS</div>
  <div class="quick">
    <button onclick="toast('Network status is managed by Android')">◉ &nbsp; Connectivity<span>Android network controls</span></button>
    <button onclick="toggleLight()">◐ &nbsp; Display<span id="lightLabel">Dark interface active</span></button>
    <button onclick="openApp('notes');closeShade()">▤ &nbsp; Quick notes<span>Open local notes</span></button>
    <button onclick="openApp('system');closeShade()">⌁ &nbsp; System status<span>Storage and app status</span></button>
  </div>
  <div class="sectionlabel">DEVICE PROFILE</div><div class="card"><div class="listitem"><span>Environment</span><span class="pill">LOCAL / OFFLINE</span></div><div class="listitem"><span>Shell version</span><span>NOCTIS 02.1</span></div><div class="listitem"><span>Host platform</span><span>Android / Chrome</span></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const icons={
medical:'<path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9"/>',
library:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 1 4 17.5zM4 6h16M8 9h8M8 13h8"/>',
location:'<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',
equipment:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V4h8v3M3 12h18M10 12v2h4v-2"/>',
notes:'<path d="M5 3h14v18H5zM8 8h8M8 12h8M8 16h5"/>',
settings:'<circle cx="12" cy="12" r="3"/><path d="m19 15 1.5 1.2-1.5 2.6-1.9-.8a8 8 0 0 1-1.5.9l-.3 2.1h-3l-.3-2.1a8 8 0 0 1-1.5-.9l-1.9.8-1.5-2.6L7 15a7 7 0 0 1 0-2l-1.9-1.2 1.5-2.6 1.9.8a8 8 0 0 1 1.5-.9l.3-2.1h3l.3 2.1a8 8 0 0 1 1.5.9l1.9-.8 1.5 2.6L19 13a7 7 0 0 1 0 2Z"/>',
system:'<path d="M4 5h16v11H4zM8 20h8M12 16v4M8 9h8M8 12h4"/>'
};
let current='home';
function time(){let d=new Date();let t=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});$('#statusTime').textContent=t;$('#shadeClock').textContent=t;$('#shadeDate').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
setInterval(time,15000);time();
function appIcon(id,label){return `<button class="app" onclick="openApp('${id}')"><span class="appicon"><svg viewBox="0 0 24 24">${icons[id]||icons.system}</svg></span><span>${label}</span></button>`}
function home(){current='home';$('#dock').style.display='flex';$('#main').innerHTML=`
<div class="topline"><div class="brand"><img class="crescent" src="noctis-logo-192.png" alt="NOCTIS crescent logo"><span class="brandname">NOCTIS</span></div><span class="system-tag">FIELD ENVIRONMENT / 02.2</span></div>
<div class="greeting"><div><div class="clock" id="homeClock"></div><div class="date" id="homeDate"></div></div><div class="weather">SYSTEM READY<br>LOCAL MODE</div></div>
<div class="sectionlabel">CORE APPLICATIONS</div><div class="grid">
${appIcon('medical','Medical')}${appIcon('library','Reference')}${appIcon('location','Position')}${appIcon('equipment','Equipment')}${appIcon('notes','Notes')}${appIcon('system','System')}${appIcon('settings','Settings')}
</div>
<div class="sectionlabel">AT A GLANCE</div><div class="tiles">
<div class="tile"><div class="k">Medical records</div><div class="v" id="patientCount">00</div><div class="sub">Stored on this device</div></div>
<div class="tile"><div class="k">Field notes</div><div class="v" id="noteCount">00</div><div class="sub">Private local entries</div></div>
</div><div class="footerline"></div><div class="muted" style="text-align:center;letter-spacing:.17em;font-size:9px">NOCTIS // QUIET SYSTEMS. CLEAR INFORMATION.</div>`;
let d=new Date();$('#homeClock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});$('#homeDate').textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});$('#patientCount').textContent=String(JSON.parse(localStorage.getItem('noctis_patients')||'[]').length).padStart(2,'0');$('#noteCount').textContent=String(JSON.parse(localStorage.getItem('noctis_notes')||'[]').length).padStart(2,'0');setDock(0)}
function setDock(i){document.querySelectorAll('.dock button').forEach((b,n)=>b.classList.toggle('active',n===i))}
function header(title,sub){return `<div class="screenhead"><button class="back" onclick="home()">‹</button><div><h1>${title}</h1><small>${sub}</small></div></div>`}
function openApp(id){current=id;$('#dock').style.display='none';let out='';if(id==='medical')out=medical();if(id==='library')out=library();if(id==='location')out=locationApp();if(id==='equipment')out=equipment();if(id==='notes')out=notes();if(id==='settings')out=settings();if(id==='system')out=system();$('#main').innerHTML=out}
function medical(){let p=JSON.parse(localStorage.getItem('noctis_patients')||'[]');return header('Medical','PATIENT MANAGEMENT')+`<div class="card"><h3>NEW PATIENT RECORD</h3><div class="field"><label>Patient identifier</label><input id="pid" placeholder="Identifier / call sign"></div><div class="field"><label>Date & time</label><input id="pdate" type="datetime-local"></div><div class="field"><label>Vitals / observations</label><textarea id="pvitals" placeholder="HR, BP, RR, SpO₂, temperature..."></textarea></div><div class="field"><label>Assessment & interventions</label><textarea id="passess" placeholder="Document findings and care provided"></textarea></div><button class="action" onclick="savePatient()">SAVE LOCAL RECORD</button></div><div class="sectionlabel">LOCAL RECORDS · ${p.length}</div><div class="card" id="patients">${p.length?p.map((x,i)=>`<div class="listitem"><span><b>${esc(x.id)}</b><br><span class="muted">${esc(x.date||'No date')}</span></span><button class="pill" onclick="viewPatient(${i})">OPEN</button></div>`).join(''):'<div class="empty">No records stored on this device.</div>'}</div><p class="muted">Prototype storage is local to this browser and is not encrypted. Do not enter identifiable patient information.</p>`}
function savePatient(){let id=$('#pid').value.trim();if(!id)return toast('Enter a patient identifier');let p=JSON.parse(localStorage.getItem('noctis_patients')||'[]');p.unshift({id,date:$('#pdate').value,vitals:$('#pvitals').value,assessment:$('#passess').value});localStorage.setItem('noctis_patients',JSON.stringify(p));toast('Record saved locally');openApp('medical')}
function viewPatient(i){let p=JSON.parse(localStorage.getItem('noctis_patients')||'[]')[i];alert('PATIENT: '+p.id+'\\nDATE: '+p.date+'\\n\\nVITALS / OBSERVATIONS\\n'+p.vitals+'\\n\\nASSESSMENT / INTERVENTIONS\\n'+p.assessment)}
function library(){return header('Reference','OFFLINE KNOWLEDGE BASE')+`<div class="card"><h3>REFERENCE LIBRARY</h3><p class="muted">A structured space for vetted, offline references. Add documents and image atlases in a future content pack; this build does not include clinical reference material.</p><div class="listitem"><span>Clinical protocols</span><span class="pill">EMPTY</span></div><div class="listitem"><span>Anatomy & imaging</span><span class="pill">EMPTY</span></div><div class="listitem"><span>Medication reference</span><span class="pill">EMPTY</span></div><div class="listitem"><span>Equipment guides</span><span class="pill">EMPTY</span></div></div><div class="card"><h3>CONTENT STATUS</h3><p class="muted">NOCTIS separates the system interface from reference content so validated materials can be added without redesigning the shell.</p></div>`}
function locationApp(){return header('Position','DEVICE SENSORS')+`<div class="card"><h3>GPS POSITION</h3><div id="coords" class="empty">Location has not been requested.</div><button class="action" onclick="getPosition()">REQUEST LOCATION</button></div><div class="card"><h3>COMPASS</h3><div id="heading" class="v" style="font-size:36px;font-weight:200">—°</div><p class="muted">Heading availability depends on browser permissions and device sensors.</p><button class="action secondary" onclick="startCompass()">ENABLE COMPASS</button></div>`}
function getPosition(){if(!navigator.geolocation)return toast('GPS unavailable in this browser');$('#coords').textContent='Acquiring position…';navigator.geolocation.getCurrentPosition(p=>{$('#coords').textContent=`LAT  ${p.coords.latitude.toFixed(6)}\\nLON  ${p.coords.longitude.toFixed(6)}\\nACCURACY  ±${Math.round(p.coords.accuracy)} m`},e=>$('#coords').textContent=e.message,{enableHighAccuracy:true,timeout:12000})}
function startCompass(){if(!('DeviceOrientationEvent'in window))return toast('Compass sensor unavailable');if(typeof DeviceOrientationEvent.requestPermission==='function'){DeviceOrientationEvent.requestPermission().then(s=>{if(s==='granted')window.addEventListener('deviceorientation',orientation);else toast('Sensor permission denied')}).catch(()=>toast('Sensor permission unavailable'))}else window.addEventListener('deviceorientation',orientation);toast('Compass enabled if sensor is supported')}
function orientation(e){let h=e.webkitCompassHeading??(e.alpha===null?null:360-e.alpha);if(h!==null)$('#heading').textContent=Math.round(h)+'°'}
function equipment(){let a=JSON.parse(localStorage.getItem('noctis_gear')||'[]');return header('Equipment','INVENTORY REGISTER')+`<div class="card"><h3>ADD ITEM</h3><div class="field"><label>Item</label><input id="gearName" placeholder="Equipment name"></div><div class="field"><label>Status / quantity</label><input id="gearStatus" placeholder="Serviceable · 1"></div><button class="action" onclick="saveGear()">ADD TO INVENTORY</button></div><div class="card"><h3>REGISTER · ${a.length}</h3>${a.length?a.map((x,i)=>`<div class="listitem"><span>${esc(x.name)}<br><span class="muted">${esc(x.status)}</span></span><button class="pill" onclick="removeGear(${i})">REMOVE</button></div>`).join(''):'<div class="empty">No equipment entered.</div>'}</div>`}
function saveGear(){let n=$('#gearName').value.trim();if(!n)return toast('Enter an item name');let a=JSON.parse(localStorage.getItem('noctis_gear')||'[]');a.push({name:n,status:$('#gearStatus').value});localStorage.setItem('noctis_gear',JSON.stringify(a));openApp('equipment')}
function removeGear(i){let a=JSON.parse(localStorage.getItem('noctis_gear')||'[]');a.splice(i,1);localStorage.setItem('noctis_gear',JSON.stringify(a));openApp('equipment')}
function notes(){let a=JSON.parse(localStorage.getItem('noctis_notes')||'[]');return header('Notes','LOCAL SCRATCHPAD')+`<div class="card"><h3>NEW NOTE</h3><div class="field"><label>Note</label><textarea id="noteText" placeholder="Write a note…"></textarea></div><button class="action" onclick="saveNote()">SAVE NOTE</button></div><div class="card"><h3>RECENT NOTES</h3>${a.length?a.map((x,i)=>`<div class="listitem"><span>${esc(x.text)}<br><span class="muted">${esc(x.date)}</span></span><button class="pill" onclick="deleteNote(${i})">DELETE</button></div>`).join(''):'<div class="empty">No notes saved.</div>'}</div>`}
function saveNote(){let t=$('#noteText').value.trim();if(!t)return toast('Write something first');let a=JSON.parse(localStorage.getItem('noctis_notes')||'[]');a.unshift({text:t,date:new Date().toLocaleString()});localStorage.setItem('noctis_notes',JSON.stringify(a));openApp('notes')}
function deleteNote(i){let a=JSON.parse(localStorage.getItem('noctis_notes')||'[]');a.splice(i,1);localStorage.setItem('noctis_notes',JSON.stringify(a));openApp('notes')}
function settings(){return header('Settings','ENVIRONMENT CONFIGURATION')+`<div class="card"><h3>INTERFACE</h3><div class="listitem"><span>Appearance</span><span class="pill">BLACK / GRAPHITE</span></div><div class="listitem"><span>System shell</span><span>NOCTIS 02.1</span></div><div class="listitem"><span>Haptics</span><span class="pill">HOST CONTROLLED</span></div></div><div class="card"><h3>DATA MANAGEMENT</h3><p class="muted">Export a local JSON backup or restore one previously exported from this device.</p><div class="row"><button class="action" onclick="backup()">EXPORT BACKUP</button><button class="action secondary" onclick="$('#restoreFile').click()">RESTORE</button><input id="restoreFile" type="file" accept="application/json" hidden onchange="restore(event)"></div></div><div class="card"><h3>PRIVACY</h3><p class="muted">Data is stored in browser localStorage. It is not encrypted, not synchronized, and may be cleared by Android or browser storage management. This prototype is not certified for clinical use.</p><button class="action secondary" onclick="clearData()">CLEAR ALL LOCAL DATA</button></div>`}
function system(){return header('System','DEVICE INFORMATION')+`<div class="card"><h3>NOCTIS CORE</h3><div class="listitem"><span>Shell</span><span>02.2 / PWA</span></div><div class="listitem"><span>Runtime</span><span>Android browser</span></div><div class="listitem"><span>Network dependency</span><span class="pill">OFFLINE SHELL</span></div><div class="listitem"><span>Data location</span><span>Browser storage</span></div><div class="listitem"><span>Install mode</span><span id="installState">${(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone)?'STANDALONE':'BROWSER'}</span></div></div><div class="card"><h3>IMPORTANT LIMITATION</h3><p class="muted">NOCTIS is an installable web app running on Android. It cannot replace Android, control the boot process, or access privileged device functions. GPS and sensors depend on Android permissions.</p></div><button class="action secondary" onclick="home()">RETURN TO HOME</button>`}
function backup(){let data={patients:localStorage.getItem('noctis_patients')||'[]',notes:localStorage.getItem('noctis_notes')||'[]',gear:localStorage.getItem('noctis_gear')||'[]'};let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='noctis-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);['patients','notes','gear'].forEach(k=>{if(d[k])localStorage.setItem('noctis_'+k,d[k])});toast('Backup restored');openApp('settings')}catch(_){toast('Invalid backup file')}};r.readAsText(f)}
function clearData(){if(confirm('Permanently clear all NOCTIS local records and notes?')){['patients','notes','gear'].forEach(k=>localStorage.removeItem('noctis_'+k));toast('Local data cleared');openApp('settings')}}
function openShade(){$('#shade').classList.add('open')}function closeShade(){$('#shade').classList.remove('open')}
function toggleLight(){toast('NOCTIS dark display is fixed in this build')}
function toast(s){let t=$('#toast');t.textContent=s;t.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>t.style.display='none',2300)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if('serviceWorker'in navigator && location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>toast('Offline cache could not be enabled')));
if(window.matchMedia('(display-mode: standalone)').matches)document.documentElement.classList.add('standalone');
home();
</script>
</body></html>
